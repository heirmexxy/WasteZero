# Use this if the server already runs nginx for other sites.
# Save as /etc/nginx/sites-available/wastezero.tech, enable it, then run certbot for HTTPS.
server {
    listen 80;
    server_name wastezero.tech www.wastezero.tech;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # pass streamed answers through immediately
        proxy_read_timeout 300s;
    }
}
